name: CI

on:
  push:
    branches: [main, architecture/platform-foundation]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/kdw_ci?schema=public
      AUTH_SECRET: ci-only-secret-for-build-validation-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm run build
